  <script>
    const CODE = "/** \uc2a4\ub808\ub4dc \ucfe0\ud30c\uc2a4 \uc790\ub3d9\ud654 \uad00\ub9ac\ub300\uc7a5 \u2014 Google Sheets + Apps Script \ubc31\uc5d4\ub4dc\n *\n *  \uc2dc\ud2b8 4\uac1c\ub97c \uc790\ub3d9\uc73c\ub85c \ub9cc\ub4e4\uace0, \uc6f9\uc571/\ubc1c\ud589 \uc5d4\uc9c4\uc774 \uc4f0\ub294 JSON API\ub97c \uc81c\uacf5\ud55c\ub2e4.\n *  \ubc30\ud3ec: \ubc30\ud3ec > \uc0c8 \ubc30\ud3ec > \uc6f9\uc571 / \uc2e4\ud589: \ub098 / \uc561\uc138\uc2a4: \ubaa8\ub4e0 \uc0ac\uc6a9\uc790\n *  \uc2a4\ud06c\ub9bd\ud2b8 \uc18d\uc131: API_TOKEN(\ud544\uc218), OWNER_EMAIL(\uc120\ud0dd)\n */\n\nvar SHEETS = {\n  PRODUCTS: '\uc0c1\ud488\ud480',\n  ACCOUNTS: '\uacc4\uc815\uc124\uc815',\n  LOGS: '\ubc1c\ud589\ub85c\uadf8',\n  RECS: '\ucd94\ucc9c\ubaa9\ub85d',\n  QUEUE: '\ubc1c\ud589\ub300\uae30',\n  PERF: '\uc2e4\uc801'\n};\n\nvar HEADERS = {\n  '\uc0c1\ud488\ud480': ['ID', '\uc0c1\ud488\uba85', '\uc2a4\ub808\ub4dcURL', '\ucfe0\ud321\uc6d0\ubcf8URL', '\ub0b4\ucfe0\ud30c\uc2a4\ub9c1\ud06c', '\ucc38\uace0\ubcf8\ubb38', '\ud65c\uc131', '\uc0ac\uc6a9\ud69f\uc218', '\ucd5c\uadfc\ubc1c\ud589\uc77c', '\ub4f1\ub85d\uc77c'],\n  '\uacc4\uc815\uc124\uc815': ['\uacc4\uc815\ubc88\ud638', '\uc774\ub984', 'ThreadsUserID', '\ud1a0\ud070\uc0c1\ud0dc', '\ud558\ub8e8\ubaa9\ud45c', '\ud65c\ub3d9\uc2dc\uc791', '\ud65c\ub3d9\uc885\ub8cc', '\uc601\uc0c1\ubcc0\ud615', '\ud65c\uc131', '\ud398\ub974\uc18c\ub098', '\ud1a0\ud070\ub9cc\ub8cc'],\n  '\ubc1c\ud589\ub85c\uadf8': ['\uc2dc\uac01', '\uacc4\uc815\ubc88\ud638', '\uacc4\uc815\uc774\ub984', '\uc0c1\ud488ID', '\uc0c1\ud488\uba85', '\ubcf8\ubb38', '\uc2a4\ub808\ub4dc\uae00URL', '\uacb0\uacfc', '\ube44\uace0', '\uc7ac\uc2dc\ub3c4'],\n  '\ucd94\ucc9c\ubaa9\ub85d': ['\ucd94\ucc9c\uc77c', '\uc21c\uc704', '\uc2a4\ub808\ub4dcURL', '\uc0c1\ud488\uba85', '\ubc18\uc751\uc9c0\ud45c', '\ud6c4\ud0b9\uc694\uc57d', '\ucfe0\ud321\uc6d0\ubcf8URL', '\uc0c1\ud0dc', '\uba54\ubaa8'],\n  '\ubc1c\ud589\ub300\uae30': ['\uc21c\uc11c', '\uc0c1\ud488ID', '\uc885\ub958', '\uc0c1\ud488\uba85', '\uacc4\uc815\ubc88\ud638', '\uc0c1\ud0dc', '\uc2dc\ub3c4', '\uc694\uccad\uc77c', '\uba54\ubaa8'],\n  '\uc2e4\uc801': ['\uc77c\uc790', '\uacc4\uc815\ubc88\ud638', '\uacc4\uc815\uc774\ub984', '\uc0c1\ud488ID', '\uc0c1\ud488\uba85', '\ud074\ub9ad', '\uc8fc\ubb38', '\uc218\uc775', '\uba54\ubaa8']\n};\n\nvar DEFAULT_DISCLOSURE = '\uc774 \ud3ec\uc2a4\ud305\uc740 \ucfe0\ud321 \ud30c\ud2b8\ub108\uc2a4 \ud65c\ub3d9\uc758 \uc77c\ud658\uc73c\ub85c, \uc774\uc5d0 \ub530\ub978 \uc77c\uc815\uc561\uc758 \uc218\uc218\ub8cc\ub97c \uc81c\uacf5\ubc1b\uc2b5\ub2c8\ub2e4.';\nvar MOBILE_UA = 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1';\n\n/* ------------------------------------------------------------------ */\n/* \uc6f9 \uc9c4\uc785\uc810                                                            */\n/* ------------------------------------------------------------------ */\nfunction doGet(e) {\n  e = e || {};\n  var params = e.parameter || {};\n  if (params.action) {\n    return jsonOut_(handle_(params.action, params));\n  }\n  try {\n    var tpl = HtmlService.createTemplateFromFile('index');\n    tpl.gasUrl = webAppUrl_();\n    return tpl.evaluate()\n      .setTitle('\uc2a4\ub808\ub4dc \ucfe0\ud30c\uc2a4')\n      .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);\n  } catch (err) {\n    return jsonOut_({ ok: true, service: 'threads-coupang', message: 'API \uc11c\ubc84\uac00 \uc2e4\ud589 \uc911\uc785\ub2c8\ub2e4. action \ud30c\ub77c\ubbf8\ud130\ub97c \ubcf4\ub0b4\uc138\uc694.', actions: Object.keys(ACTIONS) });\n  }\n}\n\nfunction doPost(e) {\n  var payload = {};\n  try {\n    payload = JSON.parse((e && e.postData && e.postData.contents) || '{}');\n  } catch (err) {\n    return jsonOut_({ ok: false, error: 'JSON \ubcf8\ubb38\uc744 \uc77d\uc744 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.' });\n  }\n  return jsonOut_(handle_(payload.action, payload));\n}\n\nfunction jsonOut_(obj) {\n  return ContentService.createTextOutput(JSON.stringify(obj))\n    .setMimeType(ContentService.MimeType.JSON);\n}\n\n/* ------------------------------------------------------------------ */\n/* \ub77c\uc6b0\ud130 / \uc778\uc99d                                                        */\n/* ------------------------------------------------------------------ */\nfunction handle_(action, payload) {\n  try {\n    if (!action) throw new Error('action\uc774 \ud544\uc694\ud569\ub2c8\ub2e4.');\n    if (!ACTIONS[action]) throw new Error('\uc54c \uc218 \uc5c6\ub294 action: ' + action);\n    if (action !== 'ping') authorize_(payload && payload.token);\n    return ACTIONS[action](payload || {});\n  } catch (err) {\n    return { ok: false, error: String(err.message || err) };\n  }\n}\n\nfunction authorize_(token) {\n  var expected = PropertiesService.getScriptProperties().getProperty('API_TOKEN');\n  if (!expected) return; // \ucd08\uae30 \uc124\uce58 \uc804\uc5d0\ub294 \uc5f4\uc5b4 \ub454\ub2e4. setup() \ud6c4 \ubc18\ub4dc\uc2dc API_TOKEN\uc744 \uc124\uc815\ud560 \uac83.\n  if (String(token || '') !== expected) throw new Error('\uc778\uc99d \uc2e4\ud328: API_TOKEN\uc774 \uc62c\ubc14\ub974\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.');\n}\n\nvar ACTIONS = {\n  ping: function () { return { ok: true, time: nowIso_(), sheets: sheetNames_() }; },\n  getAll: getAll_,\n  init: function () { setup(); return { ok: true, sheets: sheetNames_() }; },\n  addProduct: addProduct_,\n  updateProduct: updateProduct_,\n  deleteProduct: deleteProduct_,\n  toggleProduct: toggleProduct_,\n  saveAccount: saveAccount_,\n  addLog: addLog_,\n  getRecommendations: getRecommendations_,\n  saveRecommendations: saveRecommendations_,\n  takeRecommendation: takeRecommendation_,\n  passRecommendation: passRecommendation_,\n  untakeRecommendation: untakeRecommendation_,\n  getQueue: getQueue_,\n  saveQueue: saveQueue_,\n  markQueue: markQueue_,\n  retryLog: retryLog_,\n  getPerformance: getPerformance_,\n  savePerformance: savePerformance_,\n  parseThread: parseThread_\n};\n\n/* ------------------------------------------------------------------ */\n/* \uc124\uce58                                                                 */\n/* ------------------------------------------------------------------ */\n/* ------------------------------------------------------------------ */\n/* \uc2a4\ud504\ub808\uc774\ub4dc\uc2dc\ud2b8 \uc5f0\uacb0                                                  */\n/* ------------------------------------------------------------------ */\n/* \uc5f0\uacb0\ud560 \uc2a4\ud504\ub808\ub4dc\uc2dc\ud2b8 ID \u2014 \uc2dc\ud2b8\uc5d0\uc11c \ubc14\ub85c \uc5f0 \ucee8\ud14c\uc774\ub108 \ud504\ub85c\uc81d\ud2b8\ub77c\uba74 \ubb34\uc2dc\ub41c\ub2e4. */\nvar SHEET_ID = '1WEauhVGz_wOSgQhSUUlMYQ5mXQ3mspTL7cmDPWZSXmY';\n\n/** \ucee8\ud14c\uc774\ub108 \ubc14\uc778\ub529 \u2192 \uc2a4\ud06c\ub9bd\ud2b8 \uc18d\uc131 SHEET_ID \u2192 \uc624\ub958 \uc21c\uc73c\ub85c \uc2dc\ud2b8\ub97c \ucc3e\ub294\ub2e4. */\nfunction sheetApp_() {\n  var active = SpreadsheetApp.getActiveSpreadsheet();\n  if (active) return active;\n  var id = SHEET_ID || PropertiesService.getScriptProperties().getProperty('SHEET_ID');\n  if (id) return SpreadsheetApp.openById(String(id).trim());\n  throw new Error('\uc2a4\ud504\ub808\ub4dc\uc2dc\ud2b8\ub97c \ucc3e\uc9c0 \ubabb\ud588\uc2b5\ub2c8\ub2e4. \ud504\ub85c\uc81d\ud2b8 \uc124\uc815 > \uc2a4\ud06c\ub9bd\ud2b8 \uc18d\uc131\uc5d0 SHEET_ID\ub97c \ub123\uc5b4 \uc8fc\uc138\uc694.');\n}\n\n/** \ubc30\ud3ec\ub41c \uc6f9\uc571\uc758 /exec \uc8fc\uc18c (\ubc30\ud3ec \uc804\uc774\uba74 \ube48 \uac12) */\nfunction webAppUrl_() {\n  try {\n    return ScriptApp.getService().getUrl() || '';\n  } catch (err) {\n    return '';\n  }\n}\n\nfunction setup() {\n  var ss = sheetApp_();\n  Object.keys(HEADERS).forEach(function (name) {\n    var sh = ss.getSheetByName(name) || ss.insertSheet(name);\n    var headers = HEADERS[name];\n    var current = sh.getRange(1, 1, 1, headers.length).getValues()[0];\n    if (current.join('') !== headers.join('')) {\n      sh.getRange(1, 1, 1, headers.length).setValues([headers]);\n    }\n    sh.getRange(1, 1, 1, headers.length)\n      .setFontWeight('bold')\n      .setBackground('#1f2430')\n      .setFontColor('#ffffff');\n    sh.setFrozenRows(1);\n    if (sh.getMaxColumns() > headers.length) {\n      sh.deleteColumns(headers.length + 1, sh.getMaxColumns() - headers.length);\n    }\n  });\n  var defaultSheet = ss.getSheetByName('Sheet1');\n  if (defaultSheet && ss.getSheets().length > 4) ss.deleteSheet(defaultSheet);\n\n  var acct = ss.getSheetByName(SHEETS.ACCOUNTS);\n  if (acct.getLastRow() < 2) {\n    var starts = ['08:00', '09:30', '07:00', '10:00', '11:00'];\n    var ends = ['22:00', '23:00', '21:00', '23:30', '22:00'];\n    var rows = [];\n    for (var i = 1; i <= 5; i++) {\n      rows.push([i, '\uacc4\uc815 ' + i, '', '\ubbf8\uc5f0\uacb0', 7, starts[i - 1], ends[i - 1], 'original', true, '', '']);\n    }\n    acct.getRange(2, 1, rows.length, rows[0].length).setValues(rows);\n  }\n  var widths = { '\uc0c1\ud488\ud480': [90, 240, 240, 240, 200, 320, 60, 70, 100, 100], '\uacc4\uc815\uc124\uc815': [80, 140, 160, 100, 90, 90, 90, 110, 70, 220, 100], '\ubc1c\ud589\ub85c\uadf8': [130, 80, 140, 90, 220, 380, 220, 70, 180, 120], '\ucd94\ucc9c\ubaa9\ub85d': [100, 50, 240, 220, 180, 300, 220, 70, 160], '\ubc1c\ud589\ub300\uae30': [60, 110, 100, 240, 80, 80, 60, 130, 240], '\uc2e4\uc801': [100, 80, 140, 110, 240, 70, 70, 90, 200] };\n  Object.keys(widths).forEach(function (name) {\n    var sh = ss.getSheetByName(name);\n    widths[name].forEach(function (w, idx) { sh.setColumnWidth(idx + 1, w); });\n  });\n}\n\nfunction onOpen() {\n  SpreadsheetApp.getUi()\n    .createMenu('\uc2a4\ub808\ub4dc \ucfe0\ud30c\uc2a4')\n    .addItem('\uc2dc\ud2b8 \ucd08\uae30\ud654/\uc810\uac80', 'setup')\n    .addItem('API \ud1a0\ud070 \ub9cc\ub4e4\uae30', 'generateToken')\n    .addToUi();\n}\n\nfunction generateToken() {\n  var token = Utilities.getUuid().replace(/-/g, '');\n  PropertiesService.getScriptProperties().setProperty('API_TOKEN', token);\n  SpreadsheetApp.getUi().alert('API_TOKEN\uc774 \uc0dd\uc131\ub418\uc5c8\uc2b5\ub2c8\ub2e4.\\n\\n' + token + '\\n\\nGitHub Secrets\uc758 BOT_TOKEN\uacfc \uc6f9\uc571 \uc124\uc815\uc5d0 \uac19\uc740 \uac12\uc744 \ub123\uc73c\uc138\uc694.');\n}\n\n/* ------------------------------------------------------------------ */\n/* \uacf5\ud1b5                                                                 */\n/* ------------------------------------------------------------------ */\nfunction sheetNames_() {\n  return Object.keys(HEADERS).filter(function (n) {\n    return !!sheetApp_().getSheetByName(n);\n  });\n}\n\nfunction sheet_(name) {\n  var ss = sheetApp_();\n  var sh = ss.getSheetByName(name);\n  if (!sh) {\n    setup();\n    sh = ss.getSheetByName(name);\n  }\n  return sh;\n}\n\nfunction rows_(name) {\n  var sh = sheet_(name);\n  var last = sh.getLastRow();\n  if (last < 2) return [];\n  return sh.getRange(2, 1, last - 1, HEADERS[name].length).getValues();\n}\n\nfunction objects_(name, keys) {\n  return rows_(name).map(function (row) {\n    var o = {};\n    keys.forEach(function (k, i) { o[k] = row[i]; });\n    return o;\n  });\n}\n\nfunction nowIso_() {\n  return Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyy-MM-dd HH:mm:ss');\n}\n\nfunction today_() {\n  return Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyy-MM-dd');\n}\n\nfunction toBool_(v) {\n  if (v === true) return true;\n  var s = String(v || '').trim().toUpperCase();\n  return !(s === 'N' || s === 'FALSE' || s === '0' || s === '\uc911\uc9c0' || s === '\ubbf8\uc0ac\uc6a9');\n}\n\nfunction findRow_(name, predicate) {\n  var data = rows_(name);\n  for (var i = 0; i < data.length; i++) {\n    if (predicate(data[i])) return i + 2; // \uc2e4\uc81c \ud589 \ubc88\ud638\n  }\n  return -1;\n}\n\n/* ------------------------------------------------------------------ */\n/* \uc0c1\ud488 \ud480                                                              */\n/* ------------------------------------------------------------------ */\nfunction getAll_() {\n  var products = objects_(SHEETS.PRODUCTS, ['id', 'name', 'threadsUrl', 'coupangUrl', 'affiliateUrl', 'note', 'active', 'uses', 'lastPosted', 'createdAt']).map(function (p) {\n    p.id = String(p.id || '');\n    p.active = toBool_(p.active);\n    p.uses = Number(p.uses || 0);\n    return p;\n  });\n  var accounts = objects_(SHEETS.ACCOUNTS, ['no', 'name', 'userId', 'tokenStatus', 'goal', 'start', 'end', 'variant', 'active', 'personas', 'tokenExp']).map(function (a) {\n    a.no = Number(a.no);\n    a.goal = Number(a.goal || 7);\n    a.active = toBool_(a.active);\n    a.start = timeText_(a.start);\n    a.end = timeText_(a.end);\n    a.personas = String(a.personas || '');   // '\ucc10\ud6c4\uae30,\uc0b4\ub9bc\uace0\uc218' \u2014 \ubc1c\ud589 \uc5d4\uc9c4\uc774 \uc5ec\uae30\uc11c \ud558\ub098\ub97c \uace8\ub77c \uc4f4\ub2e4\n    a.tokenExp = dateText_(a.tokenExp);      // yyyy-MM-dd (\ud1a0\ud070 \ub9cc\ub8cc\uc77c)\n    return a;\n  });\n  var logs = objects_(SHEETS.LOGS, ['ts', 'accountNo', 'accountName', 'productId', 'productName', 'text', 'postUrl', 'status', 'note', 'retry']).map(function (l) {\n    l.ts = l.ts instanceof Date ? Utilities.formatDate(l.ts, 'Asia/Seoul', 'yyyy-MM-dd HH:mm') : String(l.ts || '').slice(0, 16);\n    l.accountNo = Number(l.accountNo);\n    l.retry = String(l.retry || '');\n    return l;\n  }).reverse();\n  var recommendations = recommendationsOn_(today_());\n  var queue = activeQueue_();\n  return { ok: true, serverTime: nowIso_(), today: today_(), products: products, accounts: accounts, logs: logs.slice(0, 200), recommendations: recommendations, queue: queue }; \n}\n\nfunction timeText_(v) {\n  if (v instanceof Date) return Utilities.formatDate(v, 'Asia/Seoul', 'HH:mm');\n  return String(v || '');\n}\n\n/** \ub0a0\uc9dc \uce78 \u2192 'yyyy-MM-dd'. \uc2dc\ud2b8\uac00 \ub0a0\uc9dc\ub85c \ub
